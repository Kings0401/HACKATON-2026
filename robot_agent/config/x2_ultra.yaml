# Parámetros del agente para AGIBOT X2 Ultra.
# Topics y servicios de AimDK_X2 1.1.0, comprobados en el X2 de N Club el 24-10-2026.
# Elegir otra cámara al desplegar:  .\deploy\desplegar_robot.ps1 -Camara rgbd
# Ver una foto de cada cámara:      .\deploy\desplegar_robot.ps1 -ProbarCamaras
# La clave del robot va en NCLUB_ROBOT_KEY (robot.env), nunca en este archivo.
nclub_reception_agent:
  ros__parameters:
    backend_url: "http://10.0.1.2:8000" # PC host en la red SDK cableada (10.0.1.2/24)
    robot_id: "robot1"
    # Cámara: frente (por defecto: /aima/hal/sensor/rgb_head_front_center/rgb_image) | centro |
    # estereo | rgbd | trasera | /topic/exacto
    camera: "frente"
    rotate_90: false # true solo para la cámara trasera del X2 Ultra (new version)
    # VAD de AimDK: PCM 16 kHz, 16 bits, mono; requiere palabra de activación en modo por defecto.
    audio_topic: "/agent/process_audio_output"
    registro_dir: "/data/nclub/dataset/registro"
    # Voz del robot (PlayTts). Requiere que el sistema de interacción integrado no ocupe
    # el audio: ver docs/ROBOT_PASO_A_PASO.md (modo only_voice). Pruebe antes con nclub_say.
    tts_enabled: true
    tts_service: "/aimdk_5Fmsgs/srv/PlayTts"
    asr_engine: "faster-whisper" # faster-whisper | vosk | none
    asr_model: "small"
